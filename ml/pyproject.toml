[project]
name = "fundforge-ml"
version = "0.1.0"
description = "ML lane for FundForge: environments, datasets and models that advise or play, never own the economics"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fundforge",
    "gymnasium>=1.0",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    "import-linter>=2.1",
    "jsonschema>=4.23",
]
# Training stack, kept out of the default install (and CI) so contract checks stay light.
# On Linux, PyPI torch includes CUDA libraries; install a CPU wheel yourself if you prefer.
train = [
    "torch>=2.6",
    "sb3-contrib>=2.6",
    "stable-baselines3>=2.6",
    "mlflow>=3.0",
]

[tool.uv.sources]
fundforge = { path = "../backend", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundforge_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src:../backend/src"
packages = ["fundforge_ml"]
strict = true

[[tool.mypy.overrides]]
# the backend is type-checked by its own job with its own strictness map
module = ["fundforge.*"]
follow_imports = "silent"

# The integrity boundary (DECISIONS.md, 13 Oct 2026): the engine and everything that serves it
# must never depend on ML. CI runs `lint-imports`; tests/test_boundary.py checks the same rule by source scan.
[tool.importlinter]
root_packages = ["fundforge", "fundforge_ml"]

[[tool.importlinter.contracts]]
name = "fundforge never imports fundforge_ml"
type = "forbidden"
source_modules = ["fundforge"]
forbidden_modules = ["fundforge_ml"]
