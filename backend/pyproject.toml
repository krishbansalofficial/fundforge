[project]
name = "fundforge"
version = "0.1.0"
description = "Deterministic fund/firm accounting engine for the FundForge cooperative hedge-fund game"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.142.4",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "httpx>=0.28.1",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["fundforge"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "fundforge.money", "fundforge.journal", "fundforge.series", "fundforge.execution", "fundforge.risk",
    "fundforge.tape", "fundforge.compliance", "fundforge.market", "fundforge.engine", "fundforge.shadow",
    "fundforge.terminal",
]
strict = true

[[tool.mypy.overrides]]
module = ["fundforge.governance", "fundforge.bot", "fundforge.store", "fundforge.api"]
disallow_untyped_defs = true
disallow_any_generics = false

[[tool.mypy.overrides]]
# tests are plain pytest modules (not a package); when checked, keep them lax
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = false
disallow_any_generics = false
