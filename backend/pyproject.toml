[project]
name = "fundforge"
version = "0.1.0"
description = "Deterministic fund/firm accounting engine for the FundForge cooperative hedge-fund game"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.4",
    "psycopg[binary]>=3.3.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
