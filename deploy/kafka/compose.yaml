# Local Kafka pipeline: Postgres outbox -> Debezium (Kafka Connect) -> Kafka topics fundforge.<kind>s.
# Downstream only: the game never reads Kafka and must keep working with it stopped.
# Local harness credentials only; production secrets live in .env (deploy/compose.prod.yaml).
# Start: ./fetch-debezium.sh && docker compose -f deploy/kafka/compose.yaml up -d
name: fundforge-kafka
services:
  db:
    image: postgres:17-alpine
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment: {POSTGRES_USER: fundforge, POSTGRES_PASSWORD: fundforge, POSTGRES_DB: fundforge}
    ports: ["127.0.0.1:55432:5432"]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "fundforge"], interval: 2s, retries: 30}
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports: ["127.0.0.1:29092:29092"]
  connect:
    image: apache/kafka:3.9.1
    depends_on: [kafka, db]
    command: ["/opt/kafka/bin/connect-distributed.sh", "/etc/fundforge/connect-distributed.properties"]
    environment: {KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"}
    volumes:
      - ./connect-distributed.properties:/etc/fundforge/connect-distributed.properties:ro
      - ./plugins:/opt/connectors:ro
    ports: ["127.0.0.1:8083:8083"]
