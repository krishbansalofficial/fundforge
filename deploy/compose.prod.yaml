# Single-VM production stack: Caddy TLS in front, Postgres never published, non-root app
# containers, secrets from deploy/.env, nightly verified backups.
#   cp deploy/.env.example deploy/.env   # then set real values; never commit .env
#   docker compose -f deploy/compose.prod.yaml --env-file deploy/.env up -d --build
name: fundforge

x-db-url: &db-url postgresql://fundforge:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@db:5432/fundforge

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fundforge
      POSTGRES_DB: fundforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "fundforge"], interval: 5s, retries: 20 }

  api:
    build: { context: .., dockerfile: backend/Dockerfile, target: api }
    restart: unless-stopped
    environment:
      DATABASE_URL: *db-url
      CORS_ORIGINS: https://${FUNDFORGE_DOMAIN:?set FUNDFORGE_DOMAIN in deploy/.env}
      # Only Caddy's fixed address may set X-Forwarded-For, so per-IP room limits see real clients.
      FORWARDED_ALLOW_IPS: ${EDGE_PROXY_IP:-172.30.0.2}
      FUNDFORGE_CLOCK: ${FUNDFORGE_CLOCK:-1}
    # Host-local only, for the host's Prometheus scrape of /metrics; Caddy hides /metrics publicly.
    ports: ["127.0.0.1:${METRICS_PORT:-9464}:8000"]
    networks: [edge, data]
    depends_on: { db: { condition: service_healthy } }
    # Ready once migrations are applied and the database answers; backup and caddy wait for it.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5)"]
      interval: 5s
      retries: 30
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  web:
    build: { context: ../frontend, args: { API_URL: "http://api:8000" } }
    restart: unless-stopped
    networks: [edge]
    depends_on: [api]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      FUNDFORGE_DOMAIN: ${FUNDFORGE_DOMAIN:?set FUNDFORGE_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge: { ipv4_address: "${EDGE_PROXY_IP:-172.30.0.2}" }
    depends_on: { api: { condition: service_healthy }, web: { condition: service_started } }
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]  # binds 80/443; the official image runs as root
    security_opt: [no-new-privileges:true]

  backup:
    build: { context: .., dockerfile: backend/Dockerfile, target: backup }
    restart: unless-stopped
    environment:
      DATABASE_URL: *db-url
      BACKUP_AT: ${BACKUP_AT:-03:17}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_ON_START: ${BACKUP_ON_START:-0}
    volumes: [backups:/backups]
    networks: [data]
    depends_on: { api: { condition: service_healthy } }
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

networks:
  edge:
    # Other containers get addresses from ip_range only, so Caddy's fixed EDGE_PROXY_IP is never taken first.
    ipam: { config: [{ subnet: "${EDGE_SUBNET:-172.30.0.0/24}", ip_range: "${EDGE_DYNAMIC_RANGE:-172.30.0.128/25}" }] }
  data:
    internal: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backups:
