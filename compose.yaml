services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: fundforge, POSTGRES_PASSWORD: fundforge, POSTGRES_DB: fundforge }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "fundforge"], interval: 2s, retries: 20 }
  api:
    build: { context: ., dockerfile: backend/Dockerfile, target: api }
    environment:
      DATABASE_URL: postgresql://fundforge:fundforge@db:5432/fundforge
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
  web:
    build: { context: frontend, args: { API_URL: "http://api:8000" } }
    ports: ["3000:3000"]
    depends_on: [api]
