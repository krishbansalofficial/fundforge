name: ci
on: [push, pull_request, workflow_dispatch]
permissions: { contents: read }  # no job writes to the repo; artifact upload and the cache need no contents: write
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: fundforge, POSTGRES_PASSWORD: fundforge, POSTGRES_DB: fundforge }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fundforge" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgresql://fundforge:fundforge@localhost:5432/fundforge
      PG_BIN: /usr/lib/postgresql/17/bin  # pg_dump must not be older than the postgres:17 service
      FUNDFORGE_REQUIRE_PG_DUMP: "1"  # the backup restore check fails instead of skipping
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y && sudo apt-get install -y postgresql-client-17
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
      - run: uv sync --locked --python 3.13
      - run: uv run ruff check
      - run: uv run mypy src
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run types && git diff --exit-code app/api-types.ts  # generated from openapi.json
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: python3 ../scripts/check_budgets.py --next .next  # first-load JS size budget
  game:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: game } }
    env: { GODOT_URL: "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: curl -sSL "$GODOT_URL" -o godot.zip && unzip -q godot.zip && mv Godot_v4.7.2-stable_linux.x86_64 godot
      - run: ./godot --headless --path . --import
      - run: ./godot --headless --path . --script res://tests/run_tests.gd
      - run: ./godot --headless --path . --quit-after 300
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: deploy/smoke.sh --build
      - if: failure()
        run: FUNDFORGE_DOMAIN=localhost POSTGRES_PASSWORD=unused docker compose -f deploy/compose.prod.yaml logs --no-color
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: fundforge, POSTGRES_PASSWORD: fundforge, POSTGRES_DB: fundforge }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fundforge" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgresql://fundforge:fundforge@localhost:5432/fundforge
      API_URL: http://127.0.0.1:8011
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
      - run: cd backend && uv sync --locked --python 3.13
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium && npm run build
      - name: every Playwright spec in frontend/e2e (S2 to a Win, terminal, research, investors, ledger, outcome, stale gate)
        # The API runs from the venv, not `uv run`: a lingering uv process holds uv's cache lock and makes
        # setup-uv's post-job cache prune wait 5 minutes and fail the job after the tests have passed.
        run: |
          # The suite creates about 18 rooms from 127.0.0.1, close to the default 20 per hour per address.
          (cd backend && FUNDFORGE_CLOCK=0 FUNDFORGE_TEST_VARIANTS=1 FUNDFORGE_ROOMS_PER_IP=200 exec .venv/bin/uvicorn fundforge.api:app --host 127.0.0.1 --port 8011 > ../api.log 2>&1) &
          api=$!
          (cd frontend && exec npx next start -p 3011 > ../web.log 2>&1) &
          web=$!
          trap 'kill $api $web 2>/dev/null; pkill -f next-server || true' EXIT
          for i in $(seq 60); do curl -sf http://127.0.0.1:8011/api/ready && curl -sf -o /dev/null http://127.0.0.1:3011/ && break; sleep 1; done
          cd frontend && npm run e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with: { name: e2e-trace, path: frontend/test-results, retention-days: 7 }
  export:
    runs-on: ubuntu-latest
    services:  # for the co-op acceptance run against the exported build
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: fundforge, POSTGRES_PASSWORD: fundforge, POSTGRES_DB: fundforge }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fundforge" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgresql://fundforge:fundforge@localhost:5432/fundforge
      GODOT_URL: "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
      TEMPLATES_URL: "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0; 1.3 GB; scripts/export_game.sh verifies its SHA-512 either way
        with: { path: templates.tpz, key: godot-export-templates-4.7.2-stable }
      - run: test -f templates.tpz || curl -sSL "$TEMPLATES_URL" -o templates.tpz
      - run: curl -sSL "$GODOT_URL" -o godot.zip && unzip -q godot.zip && mv Godot_v4.7.2-stable_linux.x86_64 godot
      - run: scripts/export_game.sh "$PWD/godot" templates.tpz export  # exports both, boots the Linux build
      - run: python3 scripts/check_budgets.py --export export  # desktop build size budget (frame time is local-only)
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
      - run: cd backend && uv sync --locked --python 3.13
      - name: co-op acceptance with two exported clients (split across two crises, meet, sign a package)
        run: |  # venv binaries, not `uv run`: see the e2e job (a lingering uv process fails setup-uv's cache prune)
          cd backend
          FUNDFORGE_CLOCK=0 FUNDFORGE_TEST_VARIANTS=1 .venv/bin/uvicorn fundforge.api:app --host 127.0.0.1 --port 8011 > ../api.log 2>&1 &
          api=$!
          trap 'kill $api 2>/dev/null || true' EXIT
          for i in $(seq 30); do curl -sf http://127.0.0.1:8011/api/ready && break; sleep 1; done
          .venv/bin/python ../scripts/coop_acceptance.py --server http://127.0.0.1:8011 \
            --godot "$GITHUB_WORKSPACE/export/linux/FundForge.x86_64" --exported --output ../coop-acceptance.json
          .venv/bin/python ../scripts/certification_acceptance.py --server http://127.0.0.1:8011 \
            --godot "$GITHUB_WORKSPACE/export/linux/FundForge.x86_64" --exported --output ../certification-acceptance
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2; small: the evidence log, no seat tokens
        with: { name: coop-acceptance, path: coop-acceptance.json, retention-days: 7, if-no-files-found: ignore }
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: certification-acceptance, path: certification-acceptance, retention-days: 7, if-no-files-found: ignore }
      # Binaries are about 290 MB per run: upload only when someone runs the workflow by hand, and keep them briefly.
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with: { name: fundforge-linux, path: export/linux, retention-days: 3 }
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with: { name: fundforge-windows, path: export/windows, retention-days: 3 }
  demo:  # by hand only: record the S2 run and build the README demo GIF as an artifact (nothing is published)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: fundforge, POSTGRES_PASSWORD: fundforge, POSTGRES_DB: fundforge }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fundforge" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgresql://fundforge:fundforge@localhost:5432/fundforge
      API_URL: http://127.0.0.1:8011
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
      - run: cd backend && uv sync --locked --python 3.13
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium && npm run build
      - name: record both partners playing S2 (base market)
        run: |  # venv binaries, not `uv run`: see the e2e job
          (cd backend && FUNDFORGE_CLOCK=0 FUNDFORGE_TEST_VARIANTS=1 exec .venv/bin/uvicorn fundforge.api:app --host 127.0.0.1 --port 8011 > ../api.log 2>&1) &
          api=$!
          (cd frontend && exec npx next start -p 3011 > ../web.log 2>&1) &
          web=$!
          trap 'kill $api $web 2>/dev/null; pkill -f next-server || true' EXIT
          for i in $(seq 60); do curl -sf http://127.0.0.1:8011/api/ready && curl -sf -o /dev/null http://127.0.0.1:3011/ && break; sleep 1; done
          cd frontend && FUNDFORGE_RECORD="$PWD/test-results/demo-rec" npx playwright test e2e/s2.spec.ts
      - name: build the GIF (Pillow only in this job; ffmpeg from the runner or Playwright's build)
        run: python3 -m venv /tmp/gif && /tmp/gif/bin/pip install -q pillow==12.2.0 && /tmp/gif/bin/python scripts/make_demo_gif.py frontend/test-results/demo-rec demo/s2-two-partners.gif
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: s2-demo  # pm.webm, mp.webm and the GIF
          path: |
            frontend/test-results/demo-rec
            demo
          retention-days: 7
          if-no-files-found: ignore
